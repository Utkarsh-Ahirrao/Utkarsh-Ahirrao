<rect x="350" y="244" width="8" height="8" fill="#FF6B00"/><rect x="442" y="244" width="8" height="8" fill="#FF6B00"/>

<!-- countdown -->
<g font-family="Fira Code, monospace" font-weight="700" text-anchor="middle" fill="#fff">
<text x="600" y="130" font-size="80" opacity="1"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1428;1" calcMode="discrete" dur="7s" repeatCount="indefinite"/>3</text>
<text x="600" y="130" font-size="80" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1428;0.2857;1" calcMode="discrete" dur="7s" repeatCount="indefinite"/>2</text>
<text x="600" y="130" font-size="80" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.2857;0.4286;1" calcMode="discrete" dur="7s" repeatCount="indefinite"/>1</text>
<text x="600" y="125" font-size="38" fill="#FF9F1C" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.4286;1" calcMode="discrete" dur="7s" repeatCount="indefinite"/>LIFTOFF!</text>
<text x="600" y="165" font-size="16" fill="#9fd3ff" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.4286;1" calcMode="discrete" dur="7s" repeatCount="indefinite"/>deploying to production...</text>
</g>
<text x="40" y="60" font-family="Fira Code, monospace" font-size="18" fill="#FF9F1C" font-weight="700">$ terraform apply -auto-approve</text>
<text x="40" y="88" font-family="Fira Code, monospace" font-size="14" fill="#9fd3ff">Sending infrastructure to the cloud</text>

<!-- smoke at launch -->
<g fill="#e8e8f0">
<circle cx="390" cy="256" r="6" opacity="0"><animate attributeName="r" values="6;6;34;46" keyTimes="0;0.4286;0.6;1" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;0.7;0" keyTimes="0;0.4286;0.55;1" dur="7s" repeatCount="indefinite"/><animate attributeName="cx" values="390;390;350;330" keyTimes="0;0.4286;0.6;1" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="410" cy="256" r="6" opacity="0"><animate attributeName="r" values="6;6;38;50" keyTimes="0;0.4286;0.6;1" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;0.7;0" keyTimes="0;0.4286;0.55;1" dur="7s" repeatCount="indefinite"/><animate attributeName="cx" values="410;410;450;470" keyTimes="0;0.4286;0.6;1" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="400" cy="252" r="6" opacity="0"><animate attributeName="r" values="6;6;30;40" keyTimes="0;0.4286;0.6;1" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;0.8;0" keyTimes="0;0.4286;0.55;1" dur="7s" repeatCount="indefinite"/></circle>
</g>

<!-- rocket -->
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -360" keyTimes="0;0.4286;1" calcMode="spline" keySplines="0 0 1 1;0.55 0 1 1" dur="7s" repeatCount="indefinite"/>
<!-- flame -->
<ellipse cx="400" cy="252" rx="13" ry="30" fill="url(#flame)" opacity="0">
<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.4286;1" calcMode="discrete" dur="7s" repeatCount="indefinite"/>
<animate attributeName="ry" values="24;40;24" dur="0.25s" repeatCount="indefinite"/>
</ellipse>
